# Async adapter only works within the same process, so for manually triggering cable updates from a console,
# and seeing results in the browser, you must do so from the web console (running inside the dev process),
# not a terminal started via bin/rails console! Add "console" to any action or any ERB template view
# to make the web console appear.
development:
  adapter: async

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  # 1 s, no el 0.1 del generador: el listener sondea Supabase mientras haya
  # una pestaña suscrita (el navbar de entrenador/admin lo está siempre), y
  # cada vuelta es egress de la cuota Free de la organización (2026-09-30).
  # Los broadcasts de esta app son avisos de estado (planes pendientes, plan
  # listo): llegar hasta 1 s tarde no se nota. Va con unidad ("1.second"):
  # SolidCable parsea "<número>.<unidad>" y un número pelado revienta.
  polling_interval: 1.second
  message_retention: 1.day
