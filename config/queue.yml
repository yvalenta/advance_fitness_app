default: &default
  dispatchers:
    # 2 s, no 1: mismo motivo que el worker (egress del pooler de Supabase).
    # Cada vuelta son 3 viajes (BEGIN, solid_queue_scheduled_executions,
    # COMMIT). Solo mueve los jobs con `wait:` — los recurrentes los encola el
    # scheduler directo —, así que el costo es que el push del rest-timer
    # (NotificarDescansoJob) puede llegar hasta ~4 s tarde: 2 s de dispatcher
    # más 2 s de worker. Decisión de Yonatan, 2026-09-30.
    - polling_interval: 2
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      # 2 s, no el 0.1 del generador: cada vuelta del worker son 4 viajes
      # (BEGIN, solid_queue_pauses, solid_queue_ready_executions, COMMIT) al
      # pooler de Supabase, y ese egress se cobra contra la cuota Free de 5 GB
      # de la organización. A 0.1 s eran ~8,9 vueltas/s día y noche, casi toda
      # la cuota (medido 2026-09-30); a 2 s, ~0,5/s. Un job encolado arranca
      # hasta 2 s después — ninguno de esta app es interactivo a ese grano.
      polling_interval: 2

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
