version: "8.1"

environment:
  RAILS_ENV: development

compose:
  files:
    - docker-compose.yml
  project_name: advance_fitness_app

interaction:
  bash:
    description: Shell dentro del contenedor web
    service: web
    command: /bin/bash

  bundle:
    description: Bundler (dip bundle install, dip bundle add …)
    service: web
    command: bundle

  rails:
    description: Rails (dip rails c, dip rails db:migrate, dip rails g …)
    service: web
    command: bin/rails
    subcommands:
      s:
        description: Servidor con puertos publicados
        service: web
        compose:
          run_options: [service-ports]

  # RAILS_ENV va inline en el comando además de en `environment`: el
  # `environment` de nivel de comando no siempre gana sobre el global
  # (RAILS_ENV: development) de este archivo, y con RAILS_ENV=development la
  # config de base es `url: ENV["DATABASE_URL"]` — es decir, Supabase cuando
  # .env define DEV_DATABASE_URL. `db:test:prepare` abortaba entonces con
  # ProtectedEnvironmentError contra 'production'. Con RAILS_ENV=test explícito
  # la config resuelve a TEST_DATABASE_URL (Postgres local del compose).
  test:
    description: Suite de tests (RSpec)
    service: web
    environment:
      RAILS_ENV: test
    command: bash -c "RAILS_ENV=test bin/rails db:test:prepare && RAILS_ENV=test bundle exec rspec"

  rubocop:
    description: Lint (rubocop-rails-omakase)
    service: web
    command: bin/rubocop

  brakeman:
    description: Análisis estático de seguridad
    service: web
    command: bin/brakeman --no-pager

  psql:
    description: Consola Postgres de desarrollo
    service: db
    command: psql -h db -U postgres -d advance_fitness_app_development
    environment:
      PGPASSWORD: postgres

provision:
  - dip compose down
  - dip compose build web
  - dip bundle install
  - dip rails db:prepare
  - dip rails db:prepare RAILS_ENV=test
